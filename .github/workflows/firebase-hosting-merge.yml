name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Secrets can't be read in `if:`; expose whether the deploy credential exists.
      HAS_FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKR_WORKSPACE != '' }}
    steps:
      - uses: actions/checkout@v4
      # Vite 7 needs Node 20.19+; pin the LTS so CI doesn't drift with the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
        env:
          # Browser-safe Supabase settings, stored as GitHub repository secrets.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Deploy skipped — Firebase credential not configured
        if: env.HAS_FIREBASE_SA != 'true'
        run: echo "::warning::Add the FIREBASE_SERVICE_ACCOUNT_TASKR_WORKSPACE repository secret to enable Firebase deploys."
      - if: env.HAS_FIREBASE_SA == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TASKR_WORKSPACE }}
          channelId: live
          projectId: taskr-workspace
